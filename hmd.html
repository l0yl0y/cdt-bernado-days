<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#102e55">
  <title>Christmas Countdown</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100svh;
      overflow: hidden;
      background: #102e55;
      color: #fff1c8;
      font-family: Georgia, "Times New Roman", serif;
    }

    .background {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: #102e55;
    }

    .background img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .countdown {
      position: fixed;
      top: 85%;
      left: 50%;
      width: min(94vw, 1100px);
      transform: translate(-50%, -50%);
      margin: 0;
      color: #fff0bf;
      font-size: clamp(1rem, 2.2vw, 1.8rem);
      font-weight: 700;
      line-height: 1.4;
      text-align: center;
      text-wrap: balance;
      text-shadow: 0 2px 4px #001632, 0 0 12px #001632;
    }

    @media (max-width: 600px) {
      .countdown {
        top: 82%;
        width: 92vw;
        font-size: clamp(0.95rem, 4vw, 1.25rem);
      }
    }
  </style>
</head>
<body>
  <div class="background" aria-hidden="true">
    <img src="data:image/jpeg;base64,REPLACE_BACKGROUND_DATA" alt="">
  </div>
  <main>
    <p class="countdown" aria-live="off">
      sir there are <span id="time-left">calculating...</span> left, 
      until Christmas sir<br> C-29169
    </p>
  </main>
  <script>
    const timeLeft = document.getElementById("time-left");

    function updateCountdown() {
      const now = new Date();
      let christmas = new Date(now.getFullYear(), 11, 25);

      if (now >= christmas) {
        christmas = new Date(now.getFullYear() + 1, 11, 25);
      }

      const totalSeconds = Math.max(0, Math.floor((christmas - now) / 1000));
      const days = Math.floor(totalSeconds / 86400);
      const hours = Math.floor((totalSeconds % 86400) / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = totalSeconds % 60;

      timeLeft.textContent =
        `${days} ${days === 1 ? "day" : "days"}, ` +
        `${hours} ${hours === 1 ? "hour" : "hours"}, ` +
        `${minutes} ${minutes === 1 ? "minute" : "minutes"}, ` +
        `${seconds} ${seconds === 1 ? "second" : "seconds"}`;
    }

    updateCountdown();
    setInterval(updateCountdown, 1000);
  </script>
</body>
</html>
